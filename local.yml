- hosts: localhost
  connection: local
  become: yes
  tasks:

    ########################################
    # Configure system
    ########################################

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install essential packages
      apt:
        name:
          # desktop
          - firefox-esr
          - thunderbird

          # games
          - luanti
          - 0ad

          # xmonad
          - xmonad
          - libghc-xmonad-contrib-dev
          - kitty
          - xmobar
          - scrot

          # dev
          - vim
          - git
          - htop
        state: present

    - name: Add garage host entry
      lineinfile:
        path: /etc/hosts
        line: "192.168.4.10 garage"
        state: present
        backup: yes

    ########################################
    # Configure user
    ########################################
    - name: Add user to sudoers
      user:
        name: user
        groups: sudo
        append: yes

    - name: Configure git
      shell: |
        git config --global user.email "mike@izbicki.me" || true
        git config --global user.name "Mike Izbicki" || true
      become: yes
      become_user: user

    - name: Clone dotfiles directly to user home
      shell: |
        cd $HOME
        git init -q
        git remote add origin https://github.com/mikeizbicki/dotfiles
        git fetch dotfiles
        git checkout -f dotfiles
      become: yes
      become_user: user

    ########################################
    # Configure window manager
    ########################################
    - name: Create xmonad desktop entry
      copy:
        dest: /usr/share/xsessions/xmonad.desktop
        content: |
          [Desktop Entry]
          Name=XMonad
          Comment=Lightweight tiling window manager
          Exec=xmonad
          Type=Application
          DesktopNames=XMonad

    - name: Set xmonad as default session for user
      copy:
        dest: /var/lib/AccountsService/users/user
        content: |
          [User]
          Session=xmonad

    - name: Configure GDM autologin
      lineinfile:
        path: /etc/gdm3/daemon.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        insertafter: '^\[daemon\]'
      loop:
        - { regexp: '^#?AutomaticLoginEnable', line: 'AutomaticLoginEnable=true' }
        - { regexp: '^#?AutomaticLogin=', line: 'AutomaticLogin=user' }

    - name: Disable sleep and screen blank via logind
      lineinfile:
        path: /etc/systemd/logind.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^#?IdleAction=', line: 'IdleAction=ignore' }
        - { regexp: '^#?HandleLidSwitch=', line: 'HandleLidSwitch=ignore' }
      notify: restart logind

    - name: Recompile xmonad
      command: xmonad --recompile
      become: yes
      become_user: user

  handlers:
    - name: restart logind
      systemd:
        name: systemd-logind
        state: restarted

