- hosts: localhost
  connection: local
  become: yes
  tasks:

    ########################################
    # Configure system
    ########################################

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install essential packages
      apt:
        name:
          # desktop
          - firefox-esr
          - thunderbird
          - texlive-full

          # media
          - vlc
          - mplayer

          # games
          - luanti
          - 0ad
          - fceux

          # xmonad
          - dmenu
          - gsimplecal
          - haskell-stack
          - kitty
          - libghc-xmonad-contrib-dev
          - mate-media
          - mate-power-manager
          - network-manager-gnome
          - pnmixer
          - scrot
          - trayer
          - x11-xserver-utils
          - xfonts-base
          - xmobar
          - xmonad

          # dev
          - vim
          - git
          - python3
          - python3-pip
          - python3-env
          - ffmpeg

        state: present

    - name: Configure /etc/hosts
      copy:
        src: hosts
        dest: /etc/hosts
        owner: root
        group: root
        mode: '0644'
        backup: yes

    ########################################
    # Configure user
    ########################################
    - name: Add user to sudoers
      user:
        name: user
        groups: sudo
        append: yes

    - name: Clone dotfiles directly to user home
      shell: |
        cd $HOME
        git init -q
        git remote add origin https://github.com/mikeizbicki/dotfiles || git remote set-url origin https://github.com/mikeizbicki/dotfiles
        git fetch origin dotfiles
        git checkout -f dotfiles
      become: yes
      become_user: user

    - name: Setup directory structure
      shell: |
        cd $HOME

        # delete empty folders created by (Desktop, Downloads, etc.)
        # and create the folders I like
        rmdir * || true
        mkdir proj tmp mnt downloads

        # ensure secrets have proper permissions
        touch .env
        chmod 400 .env
        mkdir -p .keys
        chmod 500 .keys
      become: yes
      become_user: user

    - name: Install python utils
      shell: |
        cd $HOME
        python3 -m venv .venv
        . venv/bin/activate
        pip3 install llm llm-groq llm-anthropic
      become: yes
      become_user: user

    ########################################
    # Configure window manager
    ########################################
    - name: Create xmonad desktop entry
      copy:
        dest: /usr/share/xsessions/xmonad.desktop
        content: |
          [Desktop Entry]
          Name=XMonad
          Comment=Lightweight tiling window manager
          Exec=xmonad
          Type=Application
          DesktopNames=XMonad

    - name: Set xmonad as default session for user
      copy:
        dest: /var/lib/AccountsService/users/user
        content: |
          [User]
          Session=xmonad

    - name: Disable sleep and screen blank via logind
      lineinfile:
        path: /etc/systemd/logind.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^#?IdleAction=', line: 'IdleAction=ignore' }
        - { regexp: '^#?HandleLidSwitch=', line: 'HandleLidSwitch=ignore' }
      notify: restart logind

  handlers:
    - name: restart logind
      systemd:
        name: systemd-logind
        state: restarted

