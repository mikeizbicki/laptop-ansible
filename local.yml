- hosts: localhost
  connection: local
  become: yes
  tasks:

    ########################################
    # Configure system
    ########################################

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Configure git (avoid interactive prompts)
      shell: |
        git config --global user.email "ansible@localhost" || true
        git config --global user.name "Ansible" || true
      become: no

    - name: Install essential packages
      apt:
        name:
          # desktop
          - firefox-esr

          # games
          - luanti
          - 0ad

          # xmonad
          - xmonad
          - libghc-xmonad-contrib-dev
          - kitty
          - xmobar
          - scrot

          # dev
          - vim
          - git
          - htop
        state: present

    - name: Add garage host entry
      lineinfile:
        path: /etc/hosts
        line: "192.168.4.10 garage"
        state: present
        backup: yes

    ########################################
    # Configure user
    ########################################
    - name: Add user to sudoers
      user:
        name: user
        groups: sudo
        append: yes
      ignore_errors: yes  # In case user doesn't exist

    - name: Clone/update dotfiles repo
      git:
        repo: https://github.com/mikeizbicki/dotfiles
        dest: "{{ ansible_env.HOME }}/dotfiles-temp"
        version: dotfiles
        force: yes
      become: no

    - name: Copy dotfiles to home directory
      shell: |
        cp -r "{{ ansible_env.HOME }}/dotfiles-temp/." /home/user
        rm -rf "{{ ansible_env.HOME }}/dotfiles-temp"
      become: no

    ########################################
    # Configure window manager
    ########################################
    - name: Create xmonad desktop entry
      copy:
        dest: /usr/share/xsessions/xmonad.desktop
        content: |
          [Desktop Entry]
          Name=XMonad
          Comment=Lightweight tiling window manager
          Exec=xmonad
          Type=Application
          DesktopNames=XMonad

    - name: Set xmonad as default session for user
      copy:
        dest: /var/lib/AccountsService/users/user
        content: |
          [User]
          Session=xmonad

    - name: Configure GDM autologin
      lineinfile:
        path: /etc/gdm3/daemon.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        insertafter: '^\[daemon\]'
      loop:
        - { regexp: '^#?AutomaticLoginEnable', line: 'AutomaticLoginEnable=true' }
        - { regexp: '^#?AutomaticLogin=', line: 'AutomaticLogin=user' }

    - name: Disable sleep and screen blank via logind
      lineinfile:
        path: /etc/systemd/logind.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^#?IdleAction=', line: 'IdleAction=ignore' }
        - { regexp: '^#?HandleLidSwitch=', line: 'HandleLidSwitch=ignore' }
      notify: restart logind

    - name: Recompile xmonad
      command: xmonad --recompile
      become: no
      become_user: user
