- hosts: localhost
  connection: local
  become: yes
  tasks:

    ########################################
    # Configure system
    ########################################

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install essential packages
      apt:
        name:
          # desktop
          - caffeine
          - cheese
          - firefox-esr
          - thunderbird
          - texlive-full
          - konqueror
          - okular
          - okular-extra-backends
          - xsane

          # media
          - vlc
          - mplayer

          # games
          - luanti
          - 0ad
          - fceux

          # xmonad
          - dmenu
          - dunst
          - gsimplecal
          - haskell-stack
          - kitty
          - libghc-xmonad-contrib-dev
          - mate-media
          - mate-power-manager
          - network-manager-gnome
          - pnmixer
          - scrot
          - trayer
          - x11-xserver-utils
          - xfonts-base
          - xmobar
          - xmonad

          # utils
          - curl
          - ffmpeg
          - jmtpfs
          - net-tools
          - nmap
          - openconnect
          - pandoc
          - rsync
          - sshfs
          - strace
          - xclip
          - xmlstarlet
          - xsel

          # dev
          - sqlite3
          - libsqlite3-dev
          - vim-gtk3
          - git
          - git-lfs
          - podman
          - python3
          - python3-pip
          - python3-venv

          # security
          - debsecan

        state: present

    - name: Configure /etc/hosts
      copy:
        src: hosts
        dest: /etc/hosts
        owner: root
        group: root
        mode: '0644'
        backup: yes

    ########################################
    # Configure Brother scanner
    ########################################
    - name: Install Brother scanner dependencies
      apt:
        name:
          - libusb-0.1-4
          - sane-utils
        state: present

    - name: Install Brother brscan4 driver
      apt:
        deb: "{{ playbook_dir }}/brscan4-0.4.11-1.amd64.deb"
      register: brscan_install

    - name: Configure Brother scanner (DCP-L2550DW via USB)
      command: brsaneconfig4 -a name=Brother model=DCP-L2550DW nodename=local
      args:
        creates: /etc/opt/brother/scanner/brscan4/brsanenetdevice4.cfg

    ########################################
    # Configure user
    ########################################
    - name: Add user to sudoers
      user:
        name: user
        groups: sudo
        append: yes

    - name: Clone dotfiles directly to user home
      shell: |
        cd $HOME
        git init -q
        git remote add origin https://github.com/mikeizbicki/dotfiles || git remote set-url origin https://github.com/mikeizbicki/dotfiles
        git fetch origin dotfiles
        git checkout -f dotfiles
      become: yes
      become_user: user

    - name: Setup directory structure
      shell: |
        cd $HOME

        # delete empty folders created by (Desktop, Downloads, etc.)
        # and create the folders I like
        rmdir * || true
        mkdir proj tmp mnt downloads

        # ensure secrets have proper permissions
        touch .env
        chmod 400 .env
        mkdir -p .keys
        chmod 500 .keys
      become: yes
      become_user: user

    - name: Install python utils
      shell: |
        cd $HOME
        python3 -m venv .venv
        . .venv/bin/activate
        pip3 install llm llm-groq llm-anthropic ttok files-to-prompt
      become: yes
      become_user: user

    ########################################
    # Configure window manager
    ########################################
    - name: Create xmonad desktop entry
      copy:
        dest: /usr/share/xsessions/xmonad.desktop
        content: |
          [Desktop Entry]
          Name=XMonad
          Comment=Lightweight tiling window manager
          Exec=xmonad
          Type=Application
          DesktopNames=XMonad

    - name: Set xmonad as default session for user
      copy:
        dest: /var/lib/AccountsService/users/user
        content: |
          [User]
          Session=xmonad

    ########################################
    # Configure power management
    # ---
    # The goal is for the laptop to never sleep.
    # The power button should hibernate.
    # There's lots of settings being changed here
    # because I'm not sure what exactly is causing sleeping.
    ########################################
    - name: Disable MATE power manager sleep/suspend
      shell: |
        gsettings set org.mate.power-manager sleep-display-ac 0
        gsettings set org.mate.power-manager sleep-display-battery 0
        gsettings set org.mate.power-manager button-lid-ac 'nothing'
        gsettings set org.mate.power-manager button-lid-battery 'nothing'
        gsettings set org.mate.power-manager button-suspend 'nothing'
        gsettings set org.mate.power-manager action-sleep-type-ac 'nothing'
        gsettings set org.mate.power-manager action-sleep-type-battery 'nothing'
        gsettings set org.mate.power-manager button-power 'hibernate'
      become: yes
      become_user: user

    - name: Ensure logind.conf.d directory exists
      file:
        path: /etc/systemd/logind.conf.d
        state: directory
        mode: '0755'

    - name: Configure logind
      copy:
        dest: /etc/systemd/logind.conf.d/power-button.conf
        content: |
          [Login]
          HandlePowerKey=hibernate
          HandleLidSwitch=ignore
          HandleLidSwitchExternalPower=ignore
          IdleAction=ignore
          IdleActionSec=infinity
        owner: root
        group: root
        mode: '0644'
      notify: restart logind

    - name: Mask systemd sleep targets
      systemd:
        name: "{{ item }}"
        masked: yes
      loop:
        - sleep.target
        - suspend.target
        - hybrid-sleep.target

    - name: Ensure GDM directories exist
      file:
        path: /etc/dconf/db/gdm.d
        state: directory
        mode: '0755'

    - name: Disable GDM automatic suspend
      copy:
        dest: /etc/dconf/db/gdm.d/disable-suspend
        content: |
          [org/gnome/settings-daemon/plugins/power]
          sleep-inactive-ac-type='nothing'
          sleep-inactive-battery-type='nothing'
      notify: update dconf

    - name: Disable GNOME power management suspend for user
      shell: |
        gsettings set org.gnome.settings-daemon.plugins.power sleep-inactive-ac-timeout 0
        gsettings set org.gnome.settings-daemon.plugins.power sleep-inactive-battery-timeout 0
        gsettings set org.gnome.settings-daemon.plugins.power sleep-inactive-ac-type 'nothing'
        gsettings set org.gnome.settings-daemon.plugins.power sleep-inactive-battery-type 'nothing'
      become: yes
      become_user: user

    - name: Disable GNOME power management suspend
      shell: |
        gsettings set org.gnome.settings-daemon.plugins.power sleep-inactive-ac-timeout 0
        gsettings set org.gnome.settings-daemon.plugins.power sleep-inactive-battery-timeout 0
        gsettings set org.gnome.settings-daemon.plugins.power sleep-inactive-ac-type 'nothing'
        gsettings set org.gnome.settings-daemon.plugins.power sleep-inactive-battery-type 'nothing'
      become: yes
      become_user: user

    - name: Disable all suspend via systemd
      copy:
        dest: /etc/systemd/sleep.conf
        content: |
          [Sleep]
          AllowSuspend=no
          AllowHibernation=yes
          AllowSuspendThenHibernate=no
          AllowHybridSleep=no

  handlers:
    - name: restart logind
      systemd:
        name: systemd-logind
        state: restarted

    - name: update dconf
      command: dconf update
